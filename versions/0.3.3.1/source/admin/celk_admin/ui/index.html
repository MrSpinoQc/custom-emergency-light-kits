<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration CELK</title>
<link rel="stylesheet" href="menu.css">
<main hidden id="panel" role="dialog" aria-modal="true" aria-labelledby="title">
  <header>
    <div><h1 id="title">Gestion des packs</h1><p>Administration CELK</p></div>
    <button id="close" type="button" aria-label="Fermer avec Échap"><kbd>Échap</kbd></button>
  </header>
  <section id="catalog">
    <div class="toolbar"><button id="refresh" type="button">Actualiser</button></div>
    <div class="pack-list" role="region" aria-label="Liste des packs" tabindex="0">
      <table>
        <thead><tr><th scope="col">Pack</th><th scope="col">Actif</th><th scope="col">Au redémarrage</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <footer><button id="save" type="button">Enregistrer les choix</button></footer>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script src="menu.js"></script>
</html>
